<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aulas — Prof. Juvenal Silva Neto</title>
    <style>
      :root {
        color-scheme: light dark;
        font: 16px/1.5 system-ui, "Segoe UI", Roboto, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }
      main {
        max-width: 32rem;
        width: 100%;
      }
      h1 {
        font-size: 1.75rem;
        margin-bottom: 0.25rem;
      }
      p.sub {
        opacity: 0.7;
        margin-top: 0;
        margin-bottom: 2rem;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      a.card {
        display: block;
        padding: 1rem 1.25rem;
        border: 1px solid color-mix(in srgb, currentColor 15%, transparent);
        border-radius: 0.75rem;
        text-decoration: none;
        color: inherit;
      }
      a.card:hover {
        border-color: color-mix(in srgb, currentColor 35%, transparent);
      }
      a.card strong {
        display: block;
        font-size: 1.05rem;
      }
      a.card span {
        opacity: 0.7;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Aulas</h1>
      <p class="sub">Materiais de aula em formato web interativo.</p>
      <!-- Para adicionar uma nova aula: publique o build em aoc/<pasta>/
           via o workflow do GitHub Actions e acrescente um item aqui. -->
      <ul>
        <li>
          <a class="card" href="aoc/arqxorg/">
            <strong>Arquitetura ou Organização?</strong>
            <span>Investigando decisões a partir de placas-mãe reais</span>
          </a>
        </li>
      </ul>
    </main>
  </body>
</html>

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "aoc/arqxorg/**"
      - "aoc/aoc_mips-mars/**"
      - "so/quiz-threads/**"
      - "so/terminal-de-bolso/**"
      - "so/materiais/**"
      - "aoc/materiais/**"
      - "sd/materiais/**"
      - "pages/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: aoc/arqxorg/package-lock.json

      - name: Install dependencies
        working-directory: aoc/arqxorg
        run: npm ci

      - name: Build
        working-directory: aoc/arqxorg
        run: npm run build

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: aoc/aoc_mips-mars/package-lock.json

      - name: Install dependencies
        working-directory: aoc/aoc_mips-mars
        run: npm ci

      - name: Build
        working-directory: aoc/aoc_mips-mars
        run: npm run build

      # Monta o site publicado: pagina inicial na raiz + cada aula em
      # aoc/<pasta>/. Para publicar uma nova aula, adicione aqui um bloco
      # equivalente ao de "arqxorg" apontando para a pasta correspondente.
      # Aulas em HTML estatico (sem build) sao copiadas direto da pasta.
      - name: Assemble Pages site
        run: |
          mkdir -p _site/aoc _site/so _site/sd
          cp pages/index.html _site/index.html
          cp -r so/quiz-threads _site/so/quiz-threads
          cp -r aoc/arqxorg/dist _site/aoc/arqxorg
          cp -r aoc/aoc_mips-mars/dist _site/aoc/aoc_mips-mars
          cp -r so/terminal-de-bolso _site/so/terminal-de-bolso
          cp -r so/materiais _site/so/materiais
          cp -r aoc/materiais _site/aoc/materiais
          cp -r sd/materiais _site/sd/materiais

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
